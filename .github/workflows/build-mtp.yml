# Cloud build: after pushing code to GitHub, automatically compile .mtp plugin package
# Usage: Repository Actions tab -> manually run "Build MTP", or auto-triggered on code push
# Artifacts: Actions -> This run -> Artifacts -> mtai-editor-mtp.zip download
# Release: Manually publish (upload .mtp via GitHub Releases webpage)

name: Build MTP

on:
  push:                      # Any push (webpage file change/code upload) will auto build
    branches: [ main, master ]
  workflow_dispatch:         # Also allows manual trigger from webpage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 (fallback)
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || echo "AGP will auto-download"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build MTP
        run: ./gradlew app:packageReleaseMtp --no-daemon

      - name: Upload MTP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtai-editor-mtp
          path: app/build/outputs/mt-plugin/*.mtp
          if-no-files-found: error
