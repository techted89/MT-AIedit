plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.mt.plugin)
}

// Speed up build
tasks.configureEach { task ->
    if (task.name.contains("lint")) {
        task.enabled = false
    }
}

// Define Java version
def javaVersion = JavaVersion.VERSION_17

android {
    namespace = 'bin.mt.plugin.pusher'
    compileSdk = 36

    defaultConfig {
        //noinspection ExpiredTargetSdkVersion
        targetSdk = 28
        minSdk = 21
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility javaVersion
        targetCompatibility javaVersion
    }

    if (project.plugins.hasPlugin(libs.plugins.kotlin.android.get().pluginId)) {
        kotlin.jvmToolchain(javaVersion.majorVersion.toInteger())
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    // OkHttp, bin.mt.json, androidx.annotation provided by SDK transitive dependencies, no extra declaration needed
}

/**
 * MT Plugin configuration
 */
mtPlugin {
    pushTarget = "auto"
    pluginID = "com.tec.aiedit"
    versionCode = 24
    versionName = "v1.3.10"
    name = "{plugin_name}"
    description = "{plugin_description}"
    mainPreference = "com.mtplugin.aieditor.settings.AiEditPreference"
    interfaces = [
            "com.mtplugin.aieditor.AiEditToolMenu",
    ]
}